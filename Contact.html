<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Félix Drault</title>
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <header>
    <nav>
        <div class="nav-brand">
            <img src="Pictures/pfp.png" alt="Photo personnelle">
            
            <h1 class="name_nav">
                <span>Félix</span>
                <span>Drault</span>
            </h1>
        </div>

        <ul class="menu">
            <li><a href="index.html"><img src="Icons/home-01-stroke-rounded.svg" alt="">Accueil</a></li>
                <li><a href="Projets.html"><img src="Icons/code-folder-stroke-rounded.svg" alt="">Projets</a></li>
                <li><a href="Contact.html"><img src="Icons/mail-01-stroke-rounded.svg" alt="">Me Contacter</a></li>
        </ul>
    </nav>
    </header>

    <main class="contact-layout">
        
        <section class="contact-form-section">
            <div class="bento-card">
                <h1 style="font-size: 1.5rem; margin-top: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 10px;">Me laisser un message</h1>
                
                <form action="https://formsubmit.co/felix.drault@etu?univ-grenoble-alpes.fr" method="POST">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="Nouveau message Portfolio">
                    
                    <div class="form-group">
                        <label for="name">Expéditeur</label>
                        <input type="text" id="name" name="name" placeholder="Nom / Entreprise" required>
                    </div>
                
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Votre adresse Mail" required>
                    </div>
                
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Votre message" rows="5" required></textarea>
                    </div>
                
                    <button type="submit" class="btn-submit">Envoyer le message</button>
                </form>
            </div>
        </section>

        <aside class="contact-info-sidebar">
            <div class="bento-card">
                <h2>Mes coordonnées</h2>
                
                <ul class="contact-info-list">
                    <li>
                        <span class="info-icon"><img src="Icons/pin-location-03-stroke-rounded.svg" alt="pin"></span>
                        <div>
                            <strong>Localisation</strong>
                            <p>Meylan, France</p>
                        </div>
                    </li>
                    <li>
                        <span class="info-icon"><img src="Icons/mail-01-stroke-rounded.svg" alt=""></span>
                        <div>
                            <strong>Adresse Email</strong>
                            <p class="no-copy">felix.drault@etu.univ-grenoble-alpes.fr</p>
                        </div>
                    </li>
                </ul>

                <div class="contact-networks">
                    <h3>Mes réseaux</h3>
                    <div class="networks-links">
                        <a href="https://github.com/FelixDrlt" target="_blank" rel="noopener noreferrer" class="network-btn">GitHub</a>
                        <a href="https://www.linkedin.com/in/felix-drault-1ba331406/" target="_blank" rel="noopener noreferrer" class="network-btn">LinkedIn</a>
                    </div>
                </div>
            </div>
        </aside>

    </main>
    
</body>
</html>
