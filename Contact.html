        <link rel="icon" type="image/png" href="Pictures/favicon-16x16.png">
</head>
<body>
    <header>
    <nav>
        <div class="marque-nav">
            <img src="Pictures/pfp.png" alt="Photo personnelle">
            
            <h1 class="nom-nav">
                <span>Félix</span>
                <span>Drault</span>

        <ul class="menu">
            <li><a href="index.html"><img src="Icons/home-01-stroke-rounded.svg" alt="">Accueil</a></li>

        </ul>
    </nav>
    </header>

    <main class="disposition-contact">
        
        <section class="section-formulaire">
            <div class="carte-bento">
                <h1>Me laisser un message</h1>
                
                <form action="https://formsubmit.co/ad2215b4866df9834348efe23ee4157d" method="POST">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="Nouveau message Portfolio">
                    <input type="hidden" name="_next" value="https://felixdrlt.github.io/portfolio/merci.html">
                    
                    <div class="groupe-formulaire">
                        <label for="name">Expéditeur</label>
                        <input type="text" id="name" name="name" placeholder="Nom / Entreprise" required>
                    </div>
                
                    <div class="groupe-formulaire">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Votre adresse Mail" required>
                    </div>
                
                    <div class="groupe-formulaire">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Votre message" rows="5" required></textarea>
                    </div>
                
                    <button type="submit" class="bouton-envoyer">Envoyer le message</button>
                </form>
            </div>
        </section>

        <aside class="barre-info">
            <div class="carte-bento">
                <h2>Mes coordonnées</h2>
                
                <ul class="liste-info">
                    <li>
                        <span class="icone-info"><img src="Icons/pin-location-03-stroke-rounded.svg" alt="pin"></span>
                        <div>
                            <strong>Localisation</strong>
                            <p>Meylan, France (38240)</p>
                        </div>
                    </li>
                    <li>
                        <span class="icone-info"><img src="Icons/mail-01-stroke-rounded.svg" alt=""></span>
                        <div>
                            <strong>Adresse Email</strong>
                            <p class="non-copiable">felix.drault@etu.univ-grenoble-alpes.fr</p>
                        </div>
                    </li>
                </ul>

                <div class="reseaux">
                    <h3>Mes réseaux</h3>
                    <div class="liens-reseaux">
                        <a href="https://github.com/FelixDrlt" target="_blank" rel="noopener noreferrer" class="bouton-reseau">GitHub</a>
                        <a href="https://www.linkedin.com/in/felix-drault-1ba331406/" target="_blank" rel="noopener noreferrer" class="bouton-reseau">LinkedIn</a>
                    </div>
                </div>
            </div>
        </aside>

    </main>
    
</body>
</html>
